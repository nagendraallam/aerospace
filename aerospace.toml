# AeroSpace Config

config-version = 2

# App launches happen only through explicit app shortcuts.
after-startup-command = []

start-at-login = true
auto-reload-config = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Restore pinned windows when window/workspace focus changes.
on-focus-changed = ['exec-and-forget ~/.config/aerospace/pin-windows.py']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

# Workspaces: 1-5 only
persistent-workspaces = ["1", "2", "3", "4", "5"]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

# Inner gaps and outer margins of 5
gaps.inner.horizontal = 5
gaps.inner.vertical =   5
gaps.outer.left =       5
gaps.outer.bottom =     5
gaps.outer.top =        5
gaps.outer.right =      5

# Pin apps to workspaces
on-window-detected = [
    { if = 'test %{app-bundle-id} = com.apple.finder', run = ['layout tiling', 'move-node-to-workspace 4'] },
    { if = 'test %{app-bundle-id} = com.openai.codex', run = ['layout tiling', 'move-node-to-workspace 3'] },
    { if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = ['layout tiling', 'move-node-to-workspace 4'] },
    { if = 'test %{app-bundle-id} = com.google.Chrome', run = ['layout tiling', 'move-node-to-workspace 2'] },
    { if = 'test %{app-bundle-id} = com.hnc.Discord', run = ['layout tiling', 'move-node-to-workspace 5'] },
]

[mode.main.binding]

    # App launchers (alt + letter = open app)
    alt-enter = ['workspace 4', 'exec-and-forget open -a "Ghostty"']
    alt-b = ['workspace 2', 'exec-and-forget open -a "Google Chrome"']
    alt-c = ['workspace 3', 'exec-and-forget open -b com.openai.codex']
    alt-d = ['workspace 5', 'exec-and-forget open -a "Discord"']
    alt-m = 'exec-and-forget open -a "Mail"'
    alt-n = 'exec-and-forget open -a "Notion"'
    alt-t = ['workspace 4', 'exec-and-forget open -a "Ghostty"']

    alt-ctrl-c = 'exec-and-forget open -a "Calendar"'

    # Layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Fullscreen toggle
    alt-f = 'fullscreen'

    # Focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move window
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Close window
    alt-w = 'close'

    # Switch workspace (1-5)
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    # Move window to workspace
    alt-shift-1 = 'exec-and-forget ~/.config/aerospace/pin-windows.py move 1'
    alt-shift-2 = 'exec-and-forget ~/.config/aerospace/pin-windows.py move 2'
    alt-shift-3 = 'exec-and-forget ~/.config/aerospace/pin-windows.py move 3'
    alt-shift-4 = 'exec-and-forget ~/.config/aerospace/pin-windows.py move 4'
    alt-shift-5 = 'exec-and-forget ~/.config/aerospace/pin-windows.py move 5'

    # Workspace back and forth
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Help overlay
    alt-shift-slash = 'exec-and-forget ~/.config/aerospace/show-help.sh'

    # Service mode
    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
