# -------------------------------------------------------------------
# Key Bindings (Ctrl+B and Backtick)
# -------------------------------------------------------------------
set -g prefix C-b
bind C-b send-prefix

set -g prefix2 `
bind ` send-prefix

# Private Ghostty signals for macOS save shortcuts.
set -s user-keys[0] "\e[99~"
set -s user-keys[1] "\e[100~"
bind-key -n User0 send-keys F11
bind-key -n User1 send-keys F12

# Private Ghostty signals for Cmd + 1..9 buffer selection in Neovim.
set -s user-keys[2] "\e[101~"
set -s user-keys[3] "\e[102~"
set -s user-keys[4] "\e[103~"
set -s user-keys[5] "\e[104~"
set -s user-keys[6] "\e[105~"
set -s user-keys[7] "\e[106~"
set -s user-keys[8] "\e[107~"
set -s user-keys[9] "\e[108~"
set -s user-keys[10] "\e[109~"
bind-key -n User2 send-keys F5
bind-key -n User3 send-keys F6
bind-key -n User4 send-keys F7
bind-key -n User5 send-keys F8
bind-key -n User6 send-keys F9
bind-key -n User7 send-keys F10
bind-key -n User8 send-keys F13
bind-key -n User9 send-keys F14
bind-key -n User10 send-keys F15

# -------------------------------------------------------------------
# Window Numbering (Start from 1 instead of 0)
# -------------------------------------------------------------------
set -g base-index 1
set -w -g pane-base-index 1
set -g renumber-windows on

# -------------------------------------------------------------------
# Gruvbox Dark Theme & Custom Spacing/Padding
# -------------------------------------------------------------------
# Base status bar styling
set -g status-style "bg=#1d2021,fg=#fbf1c7"

# Separate window tabs from each other with space padding
set -w -g window-status-separator " "

# Inactive window style (Added spaces inside for text padding)
set -w -g window-status-format " #I: #W "
set -w -g window-status-style "bg=#3c3836,fg=#a89984"

# Active window style (Added spaces inside for text padding)
set -w -g window-status-current-format " #I: #W "
set -w -g window-status-current-style "bg=#b8bb26,fg=#1d2021,bold"

# Left side padding (Adds spacing before the first window tab)
set -g status-left "  "
set -g status-left-length 10

# Right side padding (Adds clean time layout with spacing at the end)
set -g status-right "%H:%M │ %Y-%m-%d  "
set -g status-right-length 50

# Pane borders & messages
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#b8bb26"
set -g message-style "bg=#fe8019,fg=#1d2021,bold"

